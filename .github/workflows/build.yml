name: "Build (Xcode 27)"

on:
  pull_request:
    branches:
      - main
      - release
    paths:
      - "**/*.swift"
      - "Capturr.xcodeproj/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Xcode 27
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build CAPTURR
        run: |
          xcodebuild \
            -project Capturr.xcodeproj \
            -scheme Capturr \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CapturrDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
